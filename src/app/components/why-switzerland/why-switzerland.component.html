<section class="w-full py-24 px-6 bg-white overflow-hidden" id="de-ce-elvetia">
    <div class="max-w-5xl mx-auto">
        <div class="flex flex-col lg:flex-row gap-12 lg:gap-20 items-center">
            <!-- Image Column -->
            <div class="w-full lg:w-1/2 relative">
                <div
                    class="absolute -inset-4 bg-primary/5 rounded-2xl transform rotate-2 transition-transform duration-500 hover:rotate-1">
                </div>
                <div
                    class="relative rounded-xl overflow-hidden shadow-xl aspect-[4/3] lg:aspect-square bg-surface-light group">
                    <img src="assets/images/swiss-construction.webp" alt="Construcții în Elveția"
                        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                    <div
                        class="absolute bottom-6 left-6 bg-white/90 backdrop-blur-sm px-4 py-2 rounded-sm shadow-sm flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary text-sm">location_on</span>
                        <span class="text-xs font-bold text-text-main">Elveția</span>
                    </div>
                </div>
            </div>

            <!-- Content Column -->
            <div class="w-full lg:w-1/2 flex flex-col justify-center">
                <h2 class="text-3xl md:text-5xl font-extrabold text-text-main leading-snug tracking-tight mb-6">
                    {{ t('whySwitzerland.titleLine1') || 'De ce să lucrezi' }} <br>
                    <span class="text-primary">{{ t('whySwitzerland.titleLine2') || 'în Elveția?' }}</span>
                </h2>
                <p class="text-lg text-text-muted leading-relaxed mb-8">{{ t('whySwitzerland.intro') }}</p>

                <div class="flex flex-col gap-4">
                    @for (benefit of mainBenefits; track benefit.title) {
                    <div class="flex items-start gap-4">
                        <div
                            class="flex-shrink-0 w-6 h-6 rounded-full bg-primary/10 flex items-center justify-center mt-1">
                            <span class="material-symbols-outlined text-primary text-base font-bold">check</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-text-main text-lg">{{ benefit.title }}</h3>
                            <p class="text-sm text-text-muted">{{ benefit.description }}</p>
                        </div>
                    </div>
                    }
                </div>
            </div>
        </div>
    </div>
</section>
